  const vom=s.reduce((a,x)=>a+(x.vomitos||0),0), hm=Math.max(0,...s.map(x=>Number(x.heces)||0));
  const dia=s.reduce((a,x)=>a+(x.diarrea_episodios||0),0);

  return{d,vom,hm,blanda:hm>=4||dia>0,ap,alt,n:es.length,gCom:Math.round(c.reduce((a,x)=>a+(Number(x.gramos_comidos)||0),0)*10)/10};});
 const pesos=datos.filter(e=>e.tipo=="peso"&&e.datos?.kg!=null);
 const act=pesos.filter(e=>e.fecha>=dias[0]&&e.fecha<=dias[dias.length-1]).pop(), ant=pesos.filter(e=>e.fecha<dias[0]).pop();
 const prodsSem=new Set(datos.filter(e=>e.tipo=="comida"&&e.fecha>=dias[0]&&e.fecha<=dias[dias.length-1]).map(e=>e.datos?.producto).filter(Boolean));

 const nuevos=[...prodsSem].filter(p=>!prodsAnt.has(p));
 const mapA=Object.fromEntries(alimentos.map(a=>[a.id,a]));

 const prot=[...new Set(usados.flatMap(a=>(a.proteinas||"").split(",").map(x=>x.trim()).filter(Boolean)))];

 const comidasSem=datos.filter(e=>e.tipo=="comida"&&e.fecha>=dias[0]&&e.fecha<=dias[dias.length-1]);

 const cuenta={};enl.forEach(e=>{new Set((mapA[e.datos.alimento_id].proteinas||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean)).forEach(p=>cuenta[p]=(cuenta[p]||0)+1)});

 const suma=k=>Math.round(comidasSem.reduce((a,e)=>a+(Number(e.datos?.[k])||0),0)*10)/10,cuenta2=k=>comidasSem.filter(e=>e.datos?.[k]!=null).length,nC=comidasSem.length;
 const aguaP=datos.filter(e=>e.tipo=="agua"&&e.fecha>=dias[0]&&e.fecha<=dias[dias.length-1]);
 const aguaMl=Math.round(aguaP.reduce((a,e)=>a+(Number(e.datos?.ml)||0),0)*10)/10,aguaN=aguaP.filter(e=>e.datos?.ml!=null).length;
 const fac={};datos.filter(e=>e.tipo=="nota"&&e.fecha>=dias[0]&&e.fecha<=dias[dias.length-1]&&e.datos?.factores).forEach(e=>String(e.datos.factores).split(", ").forEach(x=>fac[x]=(fac[x]||0)+1));
 const facTxt=Object.entries(fac).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+" ("+v+")").join(", ");
 const met=ds=>{const r=ds.map(d=>{const es=datos.filter(e=>e.fecha==d),s=es.filter(e=>e.tipo=="sintomas").map(e=>e.datos||{}),c=es.filter(e=>e.tipo=="comida").map(e=>e.datos||{}),st=es.filter(e=>e.tipo=="estado").map(e=>e.datos||{});
  const hm=Math.max(0,...s.map(x=>Number(x.heces)||0)),dia=s.reduce((a,x)=>a+(x.diarrea_episodios||0),0);
  return{vom:s.reduce((a,x)=>a+(x.vomitos||0),0),bl:(hm>=4||dia>0)?1:0,ap:c.some(x=>x.apetito=="Menor de lo habitual")?1:0,alt:st.some(x=>x.energia!="Normal"||x.comportamiento!="Como siempre"||x.actividad!="Normal"||x.aseo!="Como siempre")?1:0,gc:c.reduce((a,x)=>a+(Number(x.gramos_comidos)||0),0),mc:c.reduce((a,x)=>a+(Number(x.ml_comidos)||0),0)}});
  const t=k=>Math.round(r.reduce((a,x)=>a+x[k],0)*10)/10;return{vom:t("vom"),bl:t("bl"),ap:t("ap"),alt:t("alt"),gc:t("gc"),mc:t("mc")}};
 const A=met(dias),B=prev?met(prev):null,nPrev=prev?datos.filter(e=>e.fecha>=prev[0]&&e.fecha<=prev[prev.length-1]).length:0;
 const cmp=(k,u)=>`${A[k]}${u} (antes: ${B[k]}${u}; ${A[k]-B[k]>=0?"+":""}${Math.round((A[k]-B[k])*10)/10}${u})`;
 const meds=datos.filter(e=>e.tipo=="medicacion"&&e.fecha>=dias[0]&&e.fecha<=dias[dias.length-1]&&e.datos?.cambio);
 const camM=[...meds.map(m=>m.fecha+": "+(m.datos.medicamento||"")+" "+m.datos.cambio),...medicinas.flatMap(m=>[(m.fecha_inicio&&m.fecha_inicio>=dias[0]&&m.fecha_inicio<=dias[dias.length-1])?"Inicio de "+m.nombre+" ("+m.fecha_inicio+")":null,(m.fecha_fin&&m.fecha_fin>=dias[0]&&m.fecha_fin<=dias[dias.length-1])?"Fin de "+m.nombre+" ("+m.fecha_fin+")":null]).filter(Boolean)];
 const notas=datos.filter(e=>e.tipo=="nota"&&e.fecha>=dias[0]&&e.fecha<=dias[dias.length-1]);
 const peores=R.map(r=>({...r,p:r.vom+(r.blanda?1:0)+(r.ap?1:0)+(r.alt?1:0)})).filter(r=>r.p>0).sort((a,b)=>b.p-a.p);
 const dif=act&&ant?(act.datos.kg-ant.datos.kg):null;
 const lab=dias.map(d=>dias.length>8?d.slice(8):d.slice(8)+"/"+d.slice(5,7));
 $("#v").innerHTML=`${nav||""}<h2>${titulo}: ${dias[0]} a ${dias[dias.length-1]}</h2><div class="c"><table>
 <tr><td>Peso actual</td><td>${act?act.datos.kg+" kg ("+act.fecha+")":"sin registro en este periodo"}</td></tr>
 <tr><td>Peso anterior registrado</td><td>${ant?ant.datos.kg+" kg ("+ant.fecha+")":"—"}</td></tr>
 <tr><td>Variación</td><td>${dif==null?"—":(dif>0?"+":"")+dif.toFixed(2)+" kg"}</td></tr>
 <tr><td>Total de vómitos</td><td>${R.reduce((a,r)=>a+r.vom,0)}</td></tr>
 <tr><td>Días con heces blandas o diarrea (≥4)</td><td>${R.filter(r=>r.blanda).length}</td></tr>
 <tr><td>Días con apetito reducido</td><td>${R.filter(r=>r.ap).length}</td></tr>
 <tr><td>Días con estado general alterado</td><td>${R.filter(r=>r.alt).length}</td></tr>
 <tr><td>Productos nuevos en este periodo</td><td>${nuevos.length?esc(nuevos.join(", ")):"ninguno"}</td></tr>
 <tr><td>Cantidades de comida (suma)</td><td>Gramos ofrecidos: ${suma("gramos")} g (${cuenta2("gramos")} de ${nC} comidas)<br>Gramos comidos: ${suma("gramos_comidos")} g (${cuenta2("gramos_comidos")} de ${nC})<br>Mililitros ofrecidos: ${suma("ml")} ml (${cuenta2("ml")} de ${nC})<br>Mililitros comidos: ${suma("ml_comidos")} ml (${cuenta2("ml_comidos")} de ${nC})<br><span class="m">Solo suman las comidas con el dato anotado; las del campo libre no entran.</span></td></tr>
 <tr><td>Agua (suma)</td><td>${aguaMl} ml (${aguaN} de ${aguaP.length} registros de agua con ml anotados)</td></tr>
 <tr><td>Factores externos anotados</td><td>${facTxt?esc(facTxt):"ninguno"}</td></tr>
 ${B?`<tr><td>Comparación con el periodo anterior</td><td>Vómitos: ${cmp("vom","")}<br>Días con heces blandas o diarrea: ${cmp("bl","")}<br>Días con apetito reducido: ${cmp("ap","")}<br>Días con estado alterado: ${cmp("alt","")}<br>Gramos comidos: ${cmp("gc"," g")}<br>Mililitros comidos: ${cmp("mc"," ml")}<br><span class="m">Periodo anterior: ${prev[0]} a ${prev[prev.length-1]} (${nPrev} ${nPrev==1?"registro":"registros"}). Con pocos registros, la comparación no es fiable.</span></td></tr>`:""}
 <tr><td>Proteína animal más frecuente</td><td>${rank.length?esc(top.map(r=>cap(r[0])).join(" y ")+" ("+rank[0][1]+(rank[0][1]==1?" comida":" comidas")+(top.length>1?", empate":"")+")"):"—"}<br><span class="m">${rank.length?"Reparto: "+esc(rank.map(r=>cap(r[0])+" "+r[1]).join(", "))+" · ":""}Basado en ${enl.length} de ${comidasSem.length} comidas con producto guardado</span></td></tr>
 <tr><td>Cambios de alimentación (inicios y fines de uso)</td><td>${camb.length?esc(camb.join("; ")):"ninguno"}</td></tr>

 <div class="c">${barras("Vómitos por día",R.map(r=>r.vom),lab,"#c0392b")}${barras("Heces: valor máximo del día (1-6)",R.map(r=>r.hm),lab,"#b9770e")}${R.some(r=>r.gCom>0)?barras("Gramos comidos por día",R.map(r=>r.gCom),lab,"#e08a1e"):""}
 ${pesos.length>1?`<h2>Evolución del peso (kg)</h2>${linea(pesos.filter(e=>e.fecha<=dias[dias.length-1]).slice(-12))}`:""}</div>
 <div class="c"><b>Notas y dudas para el veterinario</b>${notas.length?"<br>"+notas.map(n=>`<p>${esc(n.fecha)} · ${esc(n.autor)}: ${esc(n.datos.texto)}</p>`).join(""):'<p class="m">Sin notas.</p>'}</div>
 <p class="m">Resumen descriptivo de los datos anotados; no es una valoración médica. Comentadlo con el veterinario.</p>`;
 const i0=dias[0],i1=dias[dias.length-1];
 const det=datos.filter(e=>e.fecha>=i0&&e.fecha<=i1).sort((a,b)=>(a.fecha+(a.datos?.hora||"99:99")).localeCompare(b.fecha+(b.datos?.hora||"99:99")));
 const aUso=alimentos.filter(a=>!(a.fecha_fin&&a.fecha_fin<i0)&&!(a.fecha_inicio&&a.fecha_inicio>i1)),mUso=medicinas.filter(m=>!(m.fecha_fin&&m.fecha_fin<i0)&&!(m.fecha_inicio&&m.fecha_inicio>i1));
 $("#v").insertAdjacentHTML("beforeend",`<div class="c noprint"><b>Exportar e imprimir</b><br><button id="pr">Imprimir / guardar PDF</button><button class="s" id="x1">CSV: todos los registros</button><button class="s" id="x2">CSV: alimentos</button><button class="s" id="x3">CSV: medicinas</button></div>
 <div class="solo-print"><h2>Alimentos en uso en el periodo</h2>${aUso.length?aUso.map(a=>`<p>${esc(nom(a))} (${esc(a.tipo)})${a.proteinas?" · Proteína: "+esc(a.proteinas):""}${a.fecha_inicio?" · desde "+esc(a.fecha_inicio):""}${a.ingredientes?"<br><small>Ingredientes: "+esc(a.ingredientes)+"</small>":""}</p>`).join(""):"<p>Sin productos guardados.</p>"}
 <h2>Medicación en uso en el periodo</h2>${mUso.length?mUso.map(m=>`<p>${esc(m.nombre)}${m.dosis?" · "+esc(m.dosis):""}${m.frecuencia=="semanal"?" · Semanal: "+esc(m.dias_semana||""):""}${m.horas?" · Horas: "+esc(m.horas):""}${m.notas?" · "+esc(m.notas):""}</p>`).join(""):"<p>Sin medicamentos guardados.</p>"}
 <h2>Detalle de registros</h2><table>${det.map(e=>`<tr><td>${esc(e.fecha)}</td><td>${esc(e.datos?.hora||"")}</td><td>${CAMPOS[e.tipo]?CAMPOS[e.tipo].t:esc(e.tipo)}</td><td>${esc(resumenEntrada(e))}</td><td>${esc(e.autor)}</td></tr>`).join("")}</table></div>`);

function linea(p){const v=p.map(e=>e.datos.kg),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,w=600,h=120;
 const pt=v.map((x,i)=>[20+i*(w-40)/Math.max(1,v.length-1),h-10-(x-mn)/r*(h-30)]);
 return `<svg viewBox="0 0 ${w} ${h+20}"><polyline fill="none" stroke="#2f6f5e" stroke-width="2" points="${pt.map(q=>q.join(",")).join(" ")}"/>`+pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#2f6f5e"/><text x="${q[0]}" y="${q[1]-8}" text-anchor="middle" font-size="11" fill="currentColor">${v[i]}</text><text x="${q[0]}" y="${h+14}" text-anchor="middle" font-size="10" fill="currentColor">${p[i].fecha.slice(5)}</text>`).join("")+"</svg>";}
